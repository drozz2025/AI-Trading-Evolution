<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trading Guard Admin</title><style>body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-size:24px;font-weight:800}.badge{background:#e9f8ef;color:#16834b;padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border-radius:16px;padding:20px;box-shadow:0 2px 12px #0000000b}.label{font-size:13px;color:#667085}.value{font-size:32px;font-weight:800;margin-top:6px}.panel{margin-top:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:13px;border-bottom:1px solid #e8ebef}.muted{color:#667085}.login{max-width:420px;margin:100px auto;background:white;padding:28px;border-radius:18px}.input,.btn{width:100%;padding:13px;border-radius:12px;box-sizing:border-box;margin-top:10px}.input{border:1px solid #d8dee7}.btn{border:0;background:#111827;color:white;font-weight:750}.error{color:#c0392b;margin-top:10px}</style></head><body><main id="login" class="login"><h1>Trading Guard Admin</h1><p class="muted">Área reservada a administradores.</p><input id="email" class="input" type="email" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Entrar</button><div id="error" class="error"></div></main><main id="app" class="wrap" style="display:none"><div class="top"><div><div class="brand">Trading Guard · Admin</div><div class="muted">Centro de controlo</div></div><span class="badge">ADMIN · READ ONLY</span></div><section class="grid"><div class="card"><div class="label">Utilizadores</div><div id="usersCount" class="value">—</div></div><div class="card"><div class="label">Sessões ativas</div><div id="sessions" class="value">—</div></div><div class="card"><div class="label">Trading</div><div class="value">BLOCKED</div></div></section><section class="panel card"><h2>Utilizadores</h2><table class="table"><thead><tr><th>ID</th><th>Email</th><th>Criado</th></tr></thead><tbody id="users"></tbody></table></section></main><script>const API=localStorage.getItem('tg_api_base')||'';let token=localStorage.getItem('tg_admin_token')||'';async function doLogin(){const e=document.getElementById('email').value,p=document.getElementById('password').value;try{const r=await fetch(API+'/api/v1/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Login inválido');token=d.access_token;localStorage.setItem('tg_admin_token',token);load()}catch(x){document.getElementById('error').textContent=x.message}}async function load(){const h={Authorization:'Bearer '+token};const r=await fetch(API+'/api/v1/admin/overview',{headers:h});if(!r.ok){localStorage.removeItem('tg_admin_token');document.getElementById('error').textContent='Acesso de administrador não autorizado.';return}const d=await r.json();document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('usersCount').textContent=d.users;document.getElementById('sessions').textContent=d.active_sessions;const u=await fetch(API+'/api/v1/admin/users',{headers:h});const ud=await u.json();document.getElementById('users').innerHTML=(ud.users||[]).map(x=>'<tr><td>'+x.id+'</td><td>'+x.email+'</td><td>'+new Date(x.created_at*1000).toLocaleString('pt-PT')+'</td></tr>').join('')}if(token)load();</script></body></html>
