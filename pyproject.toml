[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-evolution"
version = "0.1.0"
description = "Multi-agent XAUUSD trading research and evolution platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dashboard = ["streamlit>=1.40"]
data = ["pandas>=2.2", "numpy>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
