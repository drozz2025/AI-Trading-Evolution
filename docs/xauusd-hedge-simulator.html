<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XAUUSD Hedge Simulator</title><style>body{font-family:Arial,sans-serif;background:#111;color:#eee;padding:20px;max-width:1100px;margin:auto}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.c{background:#1d1d1d;padding:15px;border-radius:10px}.b{font-size:24px;font-weight:bold}button{padding:10px 16px;margin:4px;border:0;border-radius:7px;font-weight:bold}canvas{width:100%;height:300px;background:#080808;margin-top:12px}table{width:100%;margin-top:15px;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #333}@media(max-width:700px){.g{grid-template-columns:repeat(2,1fr)}}</style></head><body><h1>XAUUSD — Simulador de Hedge</h1><p>Simulação fictícia de 30 dias. Não usa preços reais.</p><button id="play">▶ PLAY</button><button id="pause">Ⅱ PAUSE</button><button id="reset">↻ RESET</button><label> Velocidade <input id="speed" type="number" value="10" min="1" max="100"></label><p id="status">PAUSADO</p><div class="g"><div class="c">Tempo<div id="time" class="b"></div></div><div class="c">XAUUSD<div id="price" class="b"></div></div><div class="c">Equity<div id="eq" class="b"></div></div><div class="c">Resultado<div id="res" class="b"></div></div><div class="c">SELL<div id="sell" class="b"></div></div><div class="c">BUY Hedge<div id="buy" class="b"></div></div><div class="c">Exposição líquida<div id="net" class="b"></div></div><div class="c">DD máximo<div id="dd" class="b"></div></div></div><canvas id="chart" width="1000" height="300"></canvas><h2>Eventos</h2><table><thead><tr><th>Tempo</th><th>Preço</th><th>Evento</th><th>Resultado</th></tr></thead><tbody id="log"></tbody></table><script>let s,timer=null;const startPrice=4604.8,capital=5000,contract=100;function reset(){pause();s={d:1,m:0,p:startPrice,sell:.5,buy:0,be:0,hedge:false,next:0,peak:capital,maxdd:0,h:[startPrice],log:[]};render()}function pnl(){return (startPrice-s.p)*s.sell*contract+(s.buy?(s.p-s.be)*s.buy*contract:0)}function eq(){return capital+pnl()}function ev(x){s.log.unshift([`D${s.d} ${String(Math.floor(s.m/60)).padStart(2,'0')}:${String(s.m%60).padStart(2,'0')}`,s.p.toFixed(2),x,(eq()-capital).toFixed(0)]);s.log=s.log.slice(0,20)}function tick(){let v=6;s.p=Math.max(3500,s.p+(Math.random()-.5)*2*v+(Math.random()<.025?(Math.random()-.5)*70:0));s.m++;if(s.m>=1440){s.m=0;s.d++}if(!s.hedge&&pnl()<=-5000){s.buy=.5;s.be=s.p;s.hedge=true;s.next=s.p-10;ev('ABRIU BUY 0,50 — HEDGE')}if(s.hedge&&s.buy>0&&s.p<=s.next){s.buy=Math.max(0,+(s.buy-.1).toFixed(2));ev('REDUZIU BUY → '+s.buy.toFixed(2));s.next-=10}let e=eq();s.peak=Math.max(s.peak,e);s.maxdd=Math.min(s.maxdd,e-s.peak);if(e>=capital&&s.hedge){ev('RECUPEROU — FECHOU CICLO');s.hedge=false;s.buy=0;s.sell=.5;s.peak=capital}s.h.push(s.p);if(s.h.length>800)s.h.shift();if(s.d>30){pause();ev('FIM DOS 30 DIAS')}render()}function play(){if(timer)return;document.getElementById('status').textContent='A CORRER';let sp=Math.max(1,+document.getElementById('speed').value||10);timer=setInterval(()=>{for(let i=0;i<sp;i++)tick()},100)}function pause(){if(timer){clearInterval(timer);timer=null}document.getElementById('status').textContent='PAUSADO'}function render(){time.textContent=`Dia ${s.d} ${String(Math.floor(s.m/60)).padStart(2,'0')}:${String(s.m%60).padStart(2,'0')}`;price.textContent=s.p.toFixed(2);eq.textContent='€'+eq().toFixed(0);res.textContent='€'+(eq()-capital).toFixed(0);sell.textContent=s.sell.toFixed(2);buy.textContent=s.buy.toFixed(2);net.textContent=(s.sell-s.buy).toFixed(2)+' SELL';dd.textContent='€'+Math.abs(s.maxdd).toFixed(0);log.innerHTML=s.log.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join('');let c=chart,ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);let a=s.h,mi=Math.min(...a),ma=Math.max(...a);ctx.beginPath();a.forEach((v,i)=>{let x=10+i*(c.width-20)/Math.max(1,a.length-1),y=c.height-10-(v-mi)/(ma-mi||1)*(c.height-20);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}play.onclick=play;pause.onclick=pause;reset.onclick=reset;reset();</script></body></html>
