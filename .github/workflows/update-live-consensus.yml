name: Update live economic consensus

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh consensus feed
        run: python scripts/update_live_consensus.py
      - name: Commit changes
        run: |
          if git diff --quiet -- bls-test/live-consensus.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bls-test/live-consensus.json
          git commit -m "Auto-update live economic consensus"
          git push
