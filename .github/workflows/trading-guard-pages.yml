name: Trading Guard Demo Pages

on:
  push:
    branches: [main]
    paths:
      - 'trading_guard/demo/**'
      - 'trading_guard/admin/**'
      - '.github/workflows/trading-guard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site/admin
          cp trading_guard/demo/index.html _site/index.html
          cp trading_guard/admin/index.html _site/admin/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
