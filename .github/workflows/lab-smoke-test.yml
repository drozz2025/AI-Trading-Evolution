name: Lab smoke test

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'integrations/**'
      - 'pyproject.toml'
      - '.github/workflows/lab-smoke-test.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install platform
        run: python -m pip install --upgrade pip && pip install -e '.[dashboard]'
      - name: Verify laboratory configuration
        run: python -c "from pathlib import Path; assert Path('integrations/autoresearch/requirements.txt').exists(); assert Path('.devcontainer/devcontainer.json').exists(); print('AI Trading Evolution lab: OK')"
